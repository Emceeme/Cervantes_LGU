# Render Build Configuration
services:
  - type: web
    name: cervantes-lgu
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    
    # Environment variables (can also be set in Render dashboard)
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: BASE_URL
        value: https://cervantes-lgu.onrender.com

# Cron job for automated database backups (requires Render Standard plan)
crons:
  - name: daily-database-backup
    schedule: "0 2 * * *"  # Run daily at 2 AM UTC
    command: "php scripts/backup_database.php"
    service: cervantes-lgu
